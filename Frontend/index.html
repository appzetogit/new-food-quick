<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>Aodo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
</head>

<body>
  <div id="root">
    <!-- Shown until the app's code arrives; React replaces it. -->
    <style>
      .boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#061a5c}
      .boot img{width:88px;height:88px;animation:boot 1.1s ease-in-out infinite}
      .boot i{width:120px;height:4px;border-radius:4px;background:rgba(255,255,255,.15);overflow:hidden}
      .boot i::after{content:"";display:block;width:40%;height:100%;border-radius:4px;background:#b6f23c;animation:boot-bar 1.1s ease-in-out infinite}
      @keyframes boot{50%{transform:translateY(-8px) scale(1.04)}}
      @keyframes boot-bar{from{transform:translateX(-100%)}to{transform:translateX(300%)}}
      @media (prefers-reduced-motion:reduce){.boot img,.boot i::after{animation:none}}
    </style>
    <div class="boot" role="status" aria-label="Loading Aodo"><img src="/apple-touch-icon.png" alt="" /><i></i></div>
  </div>
  <script type="module" src="/src/index.jsx"></script>
</body>

</html>
